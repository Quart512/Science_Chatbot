# 이 파일은 **배포판(릴리즈 zip)용 베이스**다 — 최종 사용자가 받는 건 이 파일 하나뿐이라
# Dockerfile도 소스도 .env도 없는 폴더에서 `docker compose up -d`만으로 떠야 한다.
# 개발용 설정(로컬 빌드·.env)은 docker-compose.override.yml에 분리했다 — Compose가
# 그 파일명을 규약으로 자동 인식해 같은 디렉터리에 있으면 -f 없이도 이 파일 위에
# 덮어씌운다. 그래서 저장소를 클론한 개발 기계에서는 예전과 완전히 똑같이 동작하고,
# override를 안 담은 릴리즈 zip에서는 pull만 하는 배포 설정이 된다.
#
# 08-05 배포 재검토에서 실제로 겪은 것 두 가지가 이 분리의 이유다:
#  ① env_file은 기본이 required라 .env 없는 폴더에서는 `env file ... not found`로 즉사했다
#     (스크립트가 감지도 못 해 영문 에러만 뜨고 창이 닫힘). 배포판은 API 키를 설정 화면
#     (api_keys.py → data/app.db)에서 받으므로 .env가 아예 필요 없다 — 그래서 required:false
#     같은 신문법(Compose 2.24+, 구버전 Docker Desktop에서 오히려 깨짐) 대신 통째로 뺐다.
#  ② compose는 pull에 실패하면 build로 폴백한다(실측 확인). 릴리즈 zip엔 Dockerfile이
#     없으니 build:를 남겨두면 그 폴백이 반드시 "Dockerfile not found"로 죽는다.
services:
  science-chatbot:
    image: quart512/science-chatbot:latest # Docker Hub에서 pull만 함 (build는 override에만)
    ports:
      - "8000:8000"
    environment:
      # LOCAL_MODEL_URL이 models.py의 os.getenv 기본값(localhost:8080)을 덮어씀.
      # 컨테이너 안에서 localhost는 "자기 자신"이라 llama-server를 못 찾음 —
      # 서비스 이름(llama-server)으로 불러야 Docker 내장 DNS(127.0.0.11)가 찾아줌
      - LOCAL_MODEL_URL=http://llama-server:8080/v1
    volumes:
      # 바인드 마운트 — 사람이 직접 만드는 데이터라 호스트 경로를 그대로 노출.
      # 이미지에 굽지 않으므로 chroma_db 내용이 바뀌어도 재빌드 불필요
      - "./chroma_db:/app/chroma_db"
      # SQLite 데이터 디렉터리(6-4, 07-31) — 지금은 체크포인트 DB(orchestrator.py의
      # CHECKPOINT_DB_PATH="data/checkpoints.sqlite")뿐이지만, 나중에 관심사·실험도구
      # RDB(RoadMap "VDB vs RDB" 참고)도 파일만 분리해 같은 디렉터리에 추가될 예정 —
      # chroma_db처럼 디렉터리 단위로 마운트해두면 그때 이 파일을 다시 안 고쳐도 됨
      - "./data:/app/data"
      # 네임드 볼륨 — bge-m3 다운로드 캐시(자동 생성, 사람이 안 들여다봄).
      # 프로젝트 폴더 밖 Docker 관리 영역에 저장 → git/폴더 오염 없이 재시작해도 재사용
      - "huggingface-cache:/root/.cache/huggingface"

  llama-server:
    # llama-server 실행 파일에 붙는 인자만 적음 (ENTRYPOINT가 이미 고정돼 있음)
    command: -m /app/models/qwen_finetuned_Q4_K_M.gguf --port 8080 --host 0.0.0.0
    image: ghcr.io/ggml-org/llama.cpp:server  # build: 없음 — 우리 Dockerfile과 무관, 프리빌트 이미지 pull만
    ports:
      - "8080:8080"   # 호스트/외부에서 직접 접속할 때만 필요 — 컨테이너 간 통신엔 무관(내부 DNS로 직접 감)
    volumes:
      # GGUF 모델 파일(941MB) 바인드 마운트 — 이미지에 굽지 않아 이미지 크기 유지, 모델 교체도 재빌드 없이 가능
      - "./models:/app/models"
    profiles: ["llama"]  # 기본 `up`엔 실행 안 됨 — `--profile llama up`으로 명시해야 선택적으로 기동

volumes:
  huggingface-cache:   # 네임드 볼륨 선언 — 실제 저장 위치는 Docker가 알아서 관리(호스트별로 별개)
