# 개발 기계 전용 설정 — 릴리즈 zip에는 이 파일을 담지 않는다.
#
# Compose는 `docker-compose.override.yml`이라는 이름을 **규약으로 자동 인식**해서,
# 같은 디렉터리에 있으면 -f 플래그 없이도 docker-compose.yml 위에 병합한다(같은 키는
# 이쪽 값이 이김). 그래서 start.command / start.bat은 양쪽에서 똑같이 `docker compose up -d`
# 한 줄만 부르면 되고, 릴리즈 zip을 만들 때 파일을 리네임하는 숨은 단계도 필요 없다 —
# 그냥 이 파일을 안 담으면 배포 설정이 된다.
#
# 버린 대안: docker-compose.release.yml처럼 배포용에 별도 이름을 주는 안. 스크립트가
# -f 없이 부르므로 zip 안에서는 결국 docker-compose.yml로 리네임해야 하고, 그 리네임이
# 릴리즈 자동화의 숨은 단계로 박혀 나중에 "왜 파일명이 다르지"로 헷갈릴 여지가 있다.
services:
  science-chatbot:
    build: .        # 로컬에서 Dockerfile로 직접 빌드 (배포판은 pull만 하므로 베이스엔 없음)
    env_file:
      # 개발자 전용 값들 — LANGCHAIN_* (LangSmith 추적), HF_TOKEN(레이트 리밋 완화),
      # GOOGLE_API_KEY/ANTHROPIC_API_KEY(.env 폴백 경로. 08-05 설정 화면이 생긴 뒤로는
      # 배포판에선 DB에 저장된 키를 쓰므로 불필요해졌고, 개발 중엔 이쪽이 편해서 남김).
      - .env
