<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    AIsaac 랜딩 파비콘 — 앱(frontend-react/public/favicon.svg)과 같은 마크를 그대로 쓴다.

    08-08 — 여기 있던 파일은 v0.app 템플릿이 남긴 **보라색(#863bff) 번개 모양
    플레이스홀더**였다(v0.1.0 Windows 실사용에서 "작업표시줄에 보라색 ㅋ 모양"으로
    발견). 번들 앱은 브라우저로 열리므로 이 파비콘이 곧 작업표시줄·창 아이콘이다.

    왜 원본 사진 로고(aisaac-logo.png)를 안 쓰는가: 유리 프리즘+무지개 질감이라
    16~20px에서는 뭉개져 어두운 사각형으로만 보인다 — 이건 08-06에 실제로 렌더링해
    확인하고 `Logo.tsx`가 `LogoMark`(단순화 마크)를 따로 만든 바로 그 이유다.
    그래서 파비콘도 같은 결론을 따라 LogoMark의 두 요소(삼각형+궤도 링)로 그린다.

    삼각형 색을 media query로 뒤집는 이유: LogoMark는 색을 CSS 변수(color-text)로
    받아 테마를 따라가지만, 파비콘 SVG는 페이지 CSS 밖이라 그 변수를 못 쓴다.
    SVG 파비콘 안의 style + prefers-color-scheme는 브라우저가 지원하므로
    (Chrome·Firefox) 그걸로 라이트 탭=검정 삼각형 / 다크 탭=흰 삼각형을 만든다.
  -->
  <style>
    .prism { fill: #14161c; }
    @media (prefers-color-scheme: dark) {
      .prism { fill: #f4f4f6; }
    }
  </style>
  <defs>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a5cf0" />
      <stop offset="16.6%" stop-color="#6f5cf0" />
      <stop offset="33.3%" stop-color="#4c9ae8" />
      <stop offset="50%" stop-color="#3fbf7f" />
      <stop offset="66.6%" stop-color="#e8c44c" />
      <stop offset="83.3%" stop-color="#e8934c" />
      <stop offset="100%" stop-color="#e2564c" />
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="10" fill="none" stroke="url(#orbit)" stroke-width="2" />
  <path class="prism" d="M12 4.5 19.5 18.5 4.5 18.5Z" />
</svg>
