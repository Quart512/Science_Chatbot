<!--
  macOS .app 아이콘(AIsaac.icns)의 소스(08-09). frontend-react/public/favicon.svg의
  LogoMark(프리즘 삼각형 + 무지개 궤도 링)를 그대로 가져오되, 두 가지를 고정했다 —
  ① 원본은 prefers-color-scheme로 삼각형 색이 바뀌는데(다크 탭=흰색), 앱 아이콘은
  독립된 배경이 필요해 다크 배지 고정(#0e0f13, index.css --color-bg와 동일)으로 바꿈.
  ② 여백 없는 24x24 뷰박스를 1024 캔버스 중앙에 38배로 올리고 둥근 사각 배경을 깔았다.

  이 파일 자체는 빌드에서 안 쓴다 — GitHub Actions macOS 러너(headless, 로그인 세션
  없음)에서 QuickLook 기반 SVG 래스터화(qlmanage)가 자주 멈추거나 실패하는 게 알려진
  문제라, 그 위험한 단계를 CI 밖에서 한 번만 사람이 실행해 결과(AIsaac.icns)를 커밋해
  둔다. 로고를 바꾸면 이 파일을 고친 뒤 아래 순서로 다시 만든다(전부 macOS 기본 도구,
  qlmanage 한 단계만 GUI 세션 필요 — 로컬 macOS 터미널에서 실행):

    qlmanage -t -s 1024 -o . aisaac-icon-source.svg   # SVG → 1024px PNG (위험한 단계)
    mkdir AIsaac.iconset
    for s in 16 32 128 256 512 1024; do
      sips -z $s $s aisaac-icon-source.svg.png --out AIsaac.iconset/icon_${s}x${s}.png
    done
    cp AIsaac.iconset/icon_32x32.png   AIsaac.iconset/icon_16x16@2x.png
    cp AIsaac.iconset/icon_256x256.png AIsaac.iconset/icon_128x128@2x.png
    cp AIsaac.iconset/icon_512x512.png AIsaac.iconset/icon_256x256@2x.png
    cp AIsaac.iconset/icon_1024x1024.png AIsaac.iconset/icon_512x512@2x.png
    iconutil -c icns AIsaac.iconset -o AIsaac.icns
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a5cf0" />
      <stop offset="16.6%" stop-color="#6f5cf0" />
      <stop offset="33.3%" stop-color="#4c9ae8" />
      <stop offset="50%" stop-color="#3fbf7f" />
      <stop offset="66.6%" stop-color="#e8c44c" />
      <stop offset="83.3%" stop-color="#e8934c" />
      <stop offset="100%" stop-color="#e2564c" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="#0e0f13" />
  <g transform="translate(512 512) scale(38) translate(-12 -12)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="url(#orbit)" stroke-width="2" />
    <path fill="#f4f4f6" d="M12 4.5 19.5 18.5 4.5 18.5Z" />
  </g>
</svg>
