# 릴리즈 자동화 — 태그(v*) push 시 배포 zip 4종(macOS·Windows·Linux portable 번들 +
# Docker 배포판)을 빌드해 GitHub Release로 올린다. RoadMap "[배포] 배포 자동화 —
# 릴리즈 zip + GitHub Release" 항목.
#
# 4개 빌드 job은 각 OS의 build_bundle_*.sh/.ps1을 그대로 재사용(build-bundle-*.yml의
# PR 검증과 같은 스크립트) — 릴리즈 전용 빌드 로직을 새로 안 만들고 이미 검증된
# 경로를 그대로 태운다. Docker Hub 이미지 자체는 이 워크플로우 소관이 아니다
# (deploy.yml이 main push마다 이미 :latest로 올림 — docker-compose.yml이 그 태그를
# pull하므로 이 zip은 버전을 안 묶어도 된다).
name: 릴리즈 빌드 + GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 설정 화면 버전 표시(RoadMap "[설정] 릴리즈 버전·릴리즈 노트 토글" 항목)의 유일한
      # 소스 — pyproject.toml의 version은 릴리즈마다 손으로 맞출 두 번째 자리가 생겨서
      # 이미 어긋나 있었다(실제론 v0.1.2인데 계속 0.1.0). 태그(github.ref_name) 자체가
      # 이미 진짜 소스라 그대로 파일로 떨어뜨린다 — workflow_dispatch 테스트 실행에서는
      # 브랜치명이 찍히는데, 이건 정식 릴리즈가 아니니 의도된 동작이다.
      - run: echo "${{ github.ref_name }}" > VERSION
      # 지인 테스트 사용 데이터 공유 동의(telemetry.py 참고) — 저자 본인 LangSmith 키를
      # 소스에 절대 안 박고 여기서만(GitHub Actions 시크릿) 꺼내 번들에 넣는다. 시크릿을
      # 아직 안 등록했으면(빈 문자열) 파일 자체를 안 만든다 — telemetry.py가 파일이
      # 없으면 동의해도 조용히 무시하고 넘어가게 설계돼 있어 안전하다.
      #
      # 조건을 workflow의 `if:`가 아니라 셸 안에 둔다(08-09 실패로 확인) — GitHub Actions는
      # `secrets` 컨텍스트를 `run:` 안에서는 허용하지만 `if:` 조건식 안에서는 참조하지
      # 못하게 막는다("Unrecognized named-value: 'secrets'"로 워크플로 자체가 무효 처리됨).
      - run: |
          if [ -n "${{ secrets.LANGSMITH_COMMUNITY_API_KEY }}" ]; then
            echo "${{ secrets.LANGSMITH_COMMUNITY_API_KEY }}" > LANGSMITH_KEY
          fi
      - run: bash scripts/build_bundle_macos.sh
      - name: zip
        run: cd build && zip -r -q ../AIsaac-macos.zip AIsaac
      - uses: actions/upload-artifact@v4
        with:
          name: AIsaac-macos
          path: AIsaac-macos.zip
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - shell: pwsh
        run: Set-Content -Path VERSION -NoNewline -Value "${{ github.ref_name }}"
      # 조건을 셸 안에 둔 이유는 macOS job의 같은 스텝 주석 참고
      # ("Unrecognized named-value: 'secrets'" — if:에서 secrets 참조 불가).
      - shell: pwsh
        run: |
          if ("${{ secrets.LANGSMITH_COMMUNITY_API_KEY }}") {
            Set-Content -Path LANGSMITH_KEY -NoNewline -Value "${{ secrets.LANGSMITH_COMMUNITY_API_KEY }}"
          }
      - shell: pwsh
        run: ./scripts/build_bundle_windows.ps1
      - name: zip
        shell: pwsh
        run: Compress-Archive -Path build/AIsaac -DestinationPath AIsaac-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AIsaac-windows
          path: AIsaac-windows.zip
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: echo "${{ github.ref_name }}" > VERSION
      # 조건을 셸 안에 둔 이유는 macOS job의 같은 스텝 주석 참고.
      - run: |
          if [ -n "${{ secrets.LANGSMITH_COMMUNITY_API_KEY }}" ]; then
            echo "${{ secrets.LANGSMITH_COMMUNITY_API_KEY }}" > LANGSMITH_KEY
          fi
      - run: bash scripts/build_bundle_linux.sh
      - name: zip
        run: cd build && zip -r -q ../AIsaac-linux.zip AIsaac
      - uses: actions/upload-artifact@v4
        with:
          name: AIsaac-linux
          path: AIsaac-linux.zip
          retention-days: 1

  # Docker 배포판 — docker-compose.yml은 이미 배포 안전(env_file·build: 없음, 08-05
  # "배포용 compose 분리" 완료) 상태라 override 파일만 빼고 그대로 담으면 된다.
  # Intel Mac·Windows·일반 x86_64 Linux는 이 zip이 필요하다(portable 번들이 Apple
  # Silicon Mac 전용이라 나머지 전부의 유일한 경로 — RoadMap 참고).
  package-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 배포 폴더 조립
        run: |
          mkdir -p dist/AIsaac
          cp docker-compose.yml dist/AIsaac/
          cp start.command stop.command start.bat stop.bat dist/AIsaac/
          cp scripts/release/docker-readme.txt dist/AIsaac/README.txt
      - name: zip
        run: cd dist && zip -r -q ../AIsaac-docker.zip AIsaac
      - uses: actions/upload-artifact@v4
        with:
          name: AIsaac-docker
          path: AIsaac-docker.zip
          retention-days: 1

  release:
    needs: [build-macos, build-windows, build-linux, package-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create가 이 토큰으로 Release를 만들려면 필요
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # workflow_dispatch(수동 실행, 테스트용)는 여기까지만 돈다 — 실제 공개 Release는
      # 진짜 태그 push일 때만 만든다(빌드 4종이 전부 되는지는 이 job 진입 자체로 이미
      # 확인됨, 아티팩트도 위에서 내려받아 존재 여부까지 확인 가능).
      - name: 아티팩트 확인 (테스트 실행에서도 항상 돎)
        run: ls -la artifacts/

      - name: GitHub Release 생성 (태그 push일 때만)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # docs/releases/<태그>.md가 있으면 그 내용을 릴리즈 노트로 쓰고(사람이 직접
        # 쓴 요약 — docs/releases/README.md 참고), 없으면 --generate-notes로 폴백해
        # 커밋 로그 자동 요약을 쓴다. 릴리즈 노트를 미리 안 준비해도 배포가 안 막힌다.
        run: |
          NOTES_FILE="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_FLAG=(--notes-file "$NOTES_FILE")
          else
            NOTES_FLAG=(--generate-notes)
          fi
          gh release create "${{ github.ref_name }}" \
            artifacts/AIsaac-macos.zip \
            artifacts/AIsaac-windows.zip \
            artifacts/AIsaac-linux.zip \
            artifacts/AIsaac-docker.zip \
            --title "AIsaac ${{ github.ref_name }}" \
            "${NOTES_FLAG[@]}"
