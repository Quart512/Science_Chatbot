name: Publish Science Chatbot Image

on:
  push:
    branches: [main]
jobs:
  # test.yml을 재사용(workflow_call) — pytest 스텝 자체는 test.yml 하나에만 두고
  # 여기선 그걸 그대로 호출만 한다. test.yml은 PR에도 pull_request 트리거로 따로 붙어있어
  # merge 전에 PR 화면에서 먼저 통과 여부가 보이고, main에 push(=merge)된 뒤 이 워크플로우가
  # 다시 한번 같은 테스트를 돌려 배포 게이트로 쓴다(하나로 합치면 배포 직전 실패를 PR에서
  # 미리 못 잡음 — 두 트리거를 유지하는 이유).
  test:
    uses: ./.github/workflows/test.yml

  # 08-05에 EC2 배포 트랙을 폐지하면서 job 이름을 deploy → publish로 바꿨다. 이 job이
  # 실제로 하는 일은 "Docker Hub에 이미지를 올리는 것"까지이고, 그 뒤(사용자가 pull해서
  # 자기 컴퓨터에서 compose로 띄우는 것)는 CI 밖이다 — 08-04 싱글 유저 로컬 앱 확정의
  # 귀결(RoadMap 설계 노트 "EC2 배포 트랙 폐지" 참고). 원래 있던 scp/ssh 두 스텝(EC2로
  # docker-compose.yml 전송 → 원격에서 pull·up)은 그때 삭제했다.
  publish:
    needs: test # test job이 실패(또는 취소)하면 이 job은 시작조차 안 함
    # arm64 러너를 쓰는 이유가 원래는 "EC2가 Graviton(arm64)이라 아키텍처를 맞춘다"였는데,
    # EC2 폐지로 그 근거가 사라졌다 — 지금은 이 러너의 네이티브 아키텍처로만 빌드돼
    # 이미지가 arm64 전용이 되는 게 오히려 문제다(Windows·Intel Mac 사용자가 못 씀).
    # 멀티아키텍처(linux/amd64,linux/arm64) 전환은 예정 표 "[배포] 릴리즈 게이트" 참고 —
    # 러너·buildx 설정을 같이 바꿔야 해서 이번 폐지 작업과 분리했다.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 + push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: quart512/science-chatbot:latest
